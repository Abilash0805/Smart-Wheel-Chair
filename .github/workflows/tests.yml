name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Tests without optional pyserial (how most users run them)
        run: python -m pytest -q
      - name: Install optional pyserial and run the adapter tests too (virtual loop:// port, no hardware)
        run: |
          python -m pip install -r requirements-hardware.txt
          python -m pytest -q
      - run: python headless_demo.py
